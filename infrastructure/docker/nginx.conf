server {
    listen 80;
    server_name localhost;

    # Maximum allowed request body size for candidate document and template uploads
    client_max_body_size 50M;

    # Timeouts for document conversions and large file streaming
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # 1. Frontend Static Assets and SPA Client-Side Routing
    # Serves all static bundles directly. Client-side routes (/login, /verification, etc.)
    # fall back to /index.html for React Router.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API Reverse Proxy Routing Passthrough
    # Seamlessly proxies /api and /api/v1/* to the backend service.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Dedicated Health Check Route for Load Balancers & Monitoring
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
